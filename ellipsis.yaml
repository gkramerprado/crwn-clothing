# See https://docs.ellipsis.dev for all available configurations.

version: 1.3

workspace_type: "internal_ec2"

build:
  file: "ellipsis.Dockerfile"
  commands:
    - command: "echo 'hello world'"
      description: "This is an example command, replace it with your own."

pr_review:
  auto_review_enabled: true
  auto_summarize_pr: true
  rules:
    - "HTML class names should be lowercase and dash-case"
    - "Prevent the usage of `!important`"
    - "Prevent the usage of {' '} or similar in React, only allow in cases where it's necessary."
